[package]
name = "herse-workspace"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Folder-of-notebooks workspace: walk, notebook summaries, fuzzy find, cross-notebook search, watching, recents"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
ignore = "0.4.33"
rayon = "1.12"
memchr = "2.7"
regex = "1.11"
nucleo-matcher = "0.3.1"
unicode-segmentation = "1"
notify = { version = "8.2", default-features = false, features = ["macos_fsevent"] }
notify-debouncer-full = { version = "0.6", default-features = false, features = ["macos_fsevent"] }

[dev-dependencies]
tempfile = "3"
memmap2 = "0.9"
